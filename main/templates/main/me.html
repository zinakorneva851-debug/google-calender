{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Я </title>

    <style>
        /* Убираем стандартные отступы */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: #385448;

            /* Нежный зелёный фон */
            background: linear-gradient(
                135deg,
                #f3fbf5,
                #dcefe2
            );

            min-height: 100vh;
        }

        /* Верхнее меню */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 20px 8%;

            background-color: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);

            border-bottom: 1px solid #cfe3d5;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #4d8062;
        }

        nav a {
            color: #4d6b59;
            text-decoration: none;
            margin-left: 25px;
            font-size: 16px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #7caf8b;
        }

        /* Главная часть */
        main {
            display: flex;
            justify-content: center;
            align-items: center;

            min-height: calc(100vh - 85px);
            padding: 50px 20px;
        }

        /* Карточка */
        .profile-card {
            display: flex;
            align-items: center;
            gap: 50px;

            width: 100%;
            max-width: 950px;

            padding: 55px;

            background-color: rgba(255, 255, 255, 0.88);

            border: 1px solid #d5e8da;
            border-radius: 30px;

            box-shadow: 0 20px 50px rgba(65, 105, 80, 0.12);
        }

        /* Место для фотографии */
        .photo {
            width: 260px;
            height: 320px;

            flex-shrink: 0;

            border-radius: 28px;

            background: linear-gradient(
                145deg,
                #cce6d3,
                #a9d0b5
            );

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 80px;

            box-shadow: 0 15px 35px rgba(82, 125, 95, 0.18);
        }

        .profile-text {
            max-width: 520px;
        }

        .small-title {
            display: inline-block;

            margin-bottom: 15px;
            padding: 8px 16px;

            color: #57836a;
            background-color: #e5f3e9;

            border-radius: 30px;

            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 18px;

            color: #355b45;
            font-size: 48px;
            line-height: 1.1;
        }

        h1 span {
            color: #7caf8b;
        }

        .description {
            margin-bottom: 25px;

            color: #607566;
            font-size: 18px;
            line-height: 1.7;
        }

        /* Небольшие блоки с навыками */
        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;

            margin-bottom: 30px;
        }

        .skill {
            padding: 10px 16px;

            color: #4f745d;
            background-color: #edf7ef;

            border: 1px solid #d5e9da;
            border-radius: 20px;

            font-size: 14px;
        }

        /* Кнопки */
        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .button {
            display: inline-block;

            padding: 14px 25px;

            border-radius: 15px;

            text-decoration: none;
            font-weight: bold;

            transition: 0.3s;
        }

        .main-button {
            color: white;
            background-color: #72a681;

            box-shadow: 0 8px 20px rgba(86, 140, 103, 0.25);
        }

        .main-button:hover {
            background-color: #5f926f;
            transform: translateY(-3px);
        }

        .secondary-button {
            color: #5c8368;
            background-color: #edf7ef;

            border: 1px solid #cfe3d5;
        }

        .secondary-button:hover {
            background-color: #deefe3;
            transform: translateY(-3px);
        }

        /* Адаптация под телефон */
        @media (max-width: 750px) {
            header {
                padding: 18px 25px;
            }

            nav {
                display: none;
            }

            .profile-card {
                flex-direction: column;
                text-align: center;

                padding: 35px 25px;
            }

            .photo {
                width: 210px;
                height: 240px;
            }

            h1 {
                font-size: 36px;
            }

            .skills,
            .buttons {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">zina</div>

        <nav>
            <a href="/">main</a>
            <a href="#about">Обо мне</a>
         
        </nav>
    </header>

    <main>
        <section class="profile-card" id="about">

            <div class="photo">
                <img src="{% static 'images/image.png' %}" alt="">
            </div>

            <div class="profile-text">
                <div class="small-title"> Я </div>

                <h1>
                    Привет, я <span>Зина</span>
                </h1>

                <p class="description">
                    Я учусб создавать веб-приложения, в основном на Python и Django. 
                    А это прототип моего будущего проекта 
                </p>

                <div class="skills" id="skills">
                    <div class="skill">Python</div>
                    <div class="skill">HTML</div>
                    <div class="skill">Django</div>
                    <div class="skill">Дизайн интерфейсов</div>
                </div>

                <div class="buttons">
                    <!-- Кнопка возвращения на главную страницу -->
                    <a href="/" class="button main-button">
                        main 
                    </a>
                    </a>
                </div>
            </div>

        </section>
    </main>

</body>
</html>
