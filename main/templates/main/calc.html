<form method="post">
    {% csrf_token %}

    <input
        type="number"
        name="num1"
        placeholder="Первое число"
        step="any">

    <select name="sign">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>

    <input
        type="number"
        name="num2"
        placeholder="Второе число"
        step="any">

    <button type="submit">Посчитать</button>
    <p>Результат: {{ result }}</p>
</form>
